namespace: "Fluorite::Docs"
source_dir: "docs_src"
output_dir: "src/fluorite/docs"
master_file: "src/fluorite/docs.cr"

features:
  release_guard: true
  naming_style: "prefixed"
  prefix_format: "topic_%02d_"
  table_auto_html: true
  protect_summary: true
  summary_table: true
  master_index: true
  aliases:
    - "FluoriteDocs"
  quick_start:
    title: "Fluorite FFMPEG Toolkit Commands"
    commands:
      - "fluorite tui"
      - "fluorite probe video.mp4"
      - "fluorite discord video.mp4 --limit 25MB"
      - "fluorite gif animation.mov --fps 15 --width 480"
      - "fluorite wizard"
