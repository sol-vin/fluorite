id: GETTING_STARTED
title: Getting Started with Fluorite
summary: Introduction to Fluorite modern FFMPEG library, fluent DSL, streaming runner, and interactive Opal TUI.
track: 01_getting_started
overview: |
  Fluorite is a next-generation Crystal library and developer studio for FFMPEG.
  It transforms complex, cryptic FFmpeg command strings into expressive, type-safe, and self-documenting Crystal code.
  Fluorite includes deep media probing via `ffprobe`, a microsecond-accurate streaming progress runner, smart presets
  for Discord video budgeting and high-definition GIFs, and a full-screen reactive terminal UI powered by Opal.
related_sources:
  - "src/fluorite.cr"
  - "src/fluorite/config.cr"
  - "src/fluorite/cli.cr"
sections:
  - id: installation
    title: Installation
    summary: Adding Fluorite to your Crystal shard.yml.
    content: |
      Add `fluorite` to your project's `shard.yml`:
      ```yaml
      dependencies:
        fluorite:
          github: sol-vin/fluorite
          branch: main
      ```
      Then install dependencies:
      ```bash
      shards install
      ```
  - id: quickstart
    title: Quickstart Example
    summary: Converting media with real-time progress callbacks.
    content: |
      Convert any media file with a single call and live terminal progress:
      ```crystal
      require "fluorite"

      Fluorite.convert("input.mov")
        .to("output.mp4")
        .video_codec(:h264)
        .crf(22)
        .scale(1280, 720)
        .audio_codec(:aac)
        .run do |p|
          puts "#{p.bar} | #{p.speed_formatted} | ETA: #{p.eta_formatted}"
        end
      ```
