id: CONVERSION_PRESETS
title: Smart Conversion Presets
summary: Instant 1-line conversions for Discord file size fitting, crisp 2-pass GIFs, Web FastStart, and lossless stream cutting.
track: 04_presets
overview: |
  Fluorite includes pre-calculated, battle-tested presets for frequent media conversion tasks.
  These presets encapsulate the complex mathematical calculations and multi-pass filtergraphs
  required for professional-grade video encoding.
related_sources:
  - "src/fluorite/presets/discord.cr"
  - "src/fluorite/presets/gif.cr"
  - "src/fluorite/presets/sprite_sheet.cr"
  - "src/fluorite/presets/web.cr"
  - "src/fluorite/presets/trim.cr"
sections:
  - id: discord_budgeting
    title: Discord File Size Optimization
    summary: Guaranteeing uploads fit under Discord limits without rejection.
    content: |
      Discord rejects attachments exceeding upload limits (10MB, 25MB, or 50MB).
      Fluorite's Discord preset queries duration via `ffprobe`, allocates total bits across video and audio,
      and transcodes the video to guarantee it fits under the limit with maximal visual fidelity:
      ```crystal
      Fluorite::Presets::Discord.convert("long_recording.mp4", "discord_upload.mp4", target_mb: 25.0)
      ```
  - id: crisp_gif
    title: 2-Pass Palette GIF Generation
    summary: Generating high-definition GIFs with custom color palettes.
    content: |
      Standard GIF converters generate blurry, dithered artifacts.
      Fluorite uses a 2-pass filtergraph generating a full 256-color palette with Lanczos scaling:
      ```crystal
      Fluorite::Presets::Gif.convert("screen_record.mov", "demo.gif", fps: 15, width: 480)
      ```
  - id: sprite_sheet_compression
    title: Automated Sprite Sheet Compression Pipeline
    summary: Packing animation frames into power-of-two texture atlases with CLUT8/CLUT4 palette quantization.
    content: |
      Fluorite provides a Two-Tier Sprite Sheet Compression Pipeline (`Fluorite::SpriteSheet`) for Godot 4.8 and PS2 GS (CLUT8/CLUT4) workflows:
      ```crystal
      sheet = Fluorite.spritesheet do
        input "knight_walk.mp4"
        output "knight_sheet.png"
        frame_size 64, 64
        frames 16
        fps 12
        power_of_two!
        clut8! dither: :sierra2_4a
        pixel_art!
        metadata "knight_sheet.json"
        godot_import!
      end
      sheet.run
      ```
  - id: lossless_cut
    title: Instant Lossless Trimming
    summary: Cutting clips in milliseconds with stream copy (-c copy).
    content: |
      Cut any section of video without re-encoding:
      ```crystal
      Fluorite::Presets::Trim.cut("movie.mp4", "clip.mp4", from: "00:01:30", to: "00:02:15")
      ```
